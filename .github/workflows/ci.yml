name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: server
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: |
          go mod download
          go mod verify

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Build
        run: go build ./...

      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 ./...

  native:
    name: native
    runs-on: ubuntu-latest
    env:
      OPUS_MLOW_SHA: 93e91a74c0a2af610d8313a85e2c811081a73f93
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache opus_mlow
        id: opus-cache
        uses: actions/cache@v5
        with:
          path: opus_mlow
          key: opus-mlow-${{ env.OPUS_MLOW_SHA }}

      - name: Build opus_mlow
        if: steps.opus-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build
          git clone https://github.com/edgardmessias/opus_mlow.git
          cd opus_mlow
          git checkout "${OPUS_MLOW_SHA}"
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Vet
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: -I${{ github.workspace }}/opus_mlow/include
          CGO_LDFLAGS: -L${{ github.workspace }}/opus_mlow/build
        run: go vet -tags nativemlow ./...

      - name: Build
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: -I${{ github.workspace }}/opus_mlow/include
          CGO_LDFLAGS: -L${{ github.workspace }}/opus_mlow/build
        run: go build -tags nativemlow ./...

      - name: Test
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: -I${{ github.workspace }}/opus_mlow/include
          CGO_LDFLAGS: -L${{ github.workspace }}/opus_mlow/build
        run: go test -tags nativemlow -count=1 ./internal/voip/codec/...

      - name: Race test
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: -I${{ github.workspace }}/opus_mlow/include
          CGO_LDFLAGS: -L${{ github.workspace }}/opus_mlow/build
        run: go test -race -tags nativemlow -count=1 ./internal/voip/codec/nativemlow/...

  race:
    name: race
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Race test
        run: go test -race -count=1 ./internal/voip/...

  vuln:
    name: vuln
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  client:
    name: client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
