services:
  wacalls:
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://wacalls:wacalls@postgres:5432/wacalls?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: wacalls-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wacalls}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wacalls}
      POSTGRES_DB: ${POSTGRES_DB:-wacalls}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wacalls} -d ${POSTGRES_DB:-wacalls}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - wacalls-pg:/var/lib/postgresql/data

volumes:
  wacalls-pg:
