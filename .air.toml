root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/wacalls-dev.exe ./cmd/server"
  entrypoint = "./tmp/wacalls-dev.exe"
  args_bin = ["-addr", ":3001", "-debug", "-db", "wacalls.db"]
  include_ext = ["go"]
  exclude_dir = ["client", "tmp", "docs", "bin", "internal/app/webui/dist"]
  exclude_regex = ["_test\\.go"]
  delay = 500
  stop_on_error = true

[misc]
  clean_on_exit = true
