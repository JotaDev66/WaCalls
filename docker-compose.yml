services:
  wacalls:
    build:
      context: .
      args:
        VERSION: ${VERSION:-docker}
    # :latest = production, :develop = beta. Override with WACALLS_IMAGE.
    image: ${WACALLS_IMAGE:-ghcr.io/jotadev66/wacalls:latest}
    container_name: wacalls
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:8080"
      - "${WEBRTC_UDP_PORT:-7881}:${WEBRTC_UDP_PORT:-7881}/udp"
    environment:
      WACALLS_PUBLIC_IP: ${WACALLS_PUBLIC_IP:-}
      WACALLS_WEBRTC_UDP_PORT: ${WEBRTC_UDP_PORT:-7881}
      WACALLS_API_TOKEN: ${WACALLS_API_TOKEN:-}
      WACALLS_ADMIN_USER: ${WACALLS_ADMIN_USER:-}
      WACALLS_ADMIN_PASSWORD: ${WACALLS_ADMIN_PASSWORD:-}
      WACALLS_CORS_ORIGINS: ${WACALLS_CORS_ORIGINS:-}
      WACALLS_RATE_LIMIT: ${WACALLS_RATE_LIMIT:-}
      WACALLS_TRUSTED_PROXIES: ${WACALLS_TRUSTED_PROXIES:-}
      WACALLS_WEBHOOK_URL: ${WACALLS_WEBHOOK_URL:-}
      WACALLS_WEBHOOK_SECRET: ${WACALLS_WEBHOOK_SECRET:-}
      WACALLS_DIAG_DIR: ${WACALLS_DIAG_DIR:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-}
    volumes:
      - wacalls-data:/data

volumes:
  wacalls-data:
