version: "2"

linters:
  default: standard
  enable:
    - modernize
    - depguard
  settings:
    depguard:
      rules:
        core-transport-agnostic:
          files:
            - "**/internal/voip/core/**"
          deny:
            - pkg: go.mau.fi/whatsmeow
              desc: voip/core must stay transport-agnostic; whatsmeow types belong in signaling/wa
  exclusions:
    paths:
      - client/node_modules
    rules:
      - linters:
          - staticcheck
        text: SA1019
      - linters:
          - modernize
        text: newexpr

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - client/node_modules
